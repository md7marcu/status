# One status page for all of md7marcu's projects. Each project is a group of rows; to add one,
# copy a block below. Checks run from GitHub Actions every 5 minutes (often later).
# Body rules read the JSON each /health returns; never put keys or private URLs here (public repo).
owner: md7marcu
repo: status
# Down and degraded issues are assigned here, so GitHub notifies on every change of state.
assignees:
  - md7marcu

sites:
  # WhereToWatch: /health is {"status":…,"env":…,"db":"ok","search":"ok"}
  - name: WhereToWatch API
    url: https://wtw.mcrsc.org/health
    __dangerous__body_down_if_text_missing: '"db":"ok"'
    maxResponseTime: 5000
  - name: WhereToWatch search
    url: https://wtw.mcrsc.org/health
    expectedStatusCodes: [200]
    __dangerous__body_degraded: '"search":"unreachable"'
    slug: wheretowatch-search
  - name: WhereToWatch deploys
    # The listener answers GET /webhook with 404 "not found"; a stopped listener or tunnel gives 502/530.
    url: https://wtw.mcrsc.org/webhook
    expectedStatusCodes: [404]
    __dangerous__body_down_if_text_missing: "not found"
  - name: WhereToWatch API (staging)
    url: https://wtw-staging.mcrsc.org/health
    __dangerous__body_down_if_text_missing: '"db":"ok"'
    maxResponseTime: 5000
  - name: WhereToWatch search (staging)
    url: https://wtw-staging.mcrsc.org/health
    expectedStatusCodes: [200]
    __dangerous__body_degraded: '"search":"unreachable"'
    slug: wheretowatch-search-staging

  # brak: /health is {"status":"ok",…,"services":{"database":"connected"}}
  - name: brak API
    url: https://brak.mcrsc.org/health
    __dangerous__body_down_if_text_missing: '"database":"connected"'
    maxResponseTime: 5000

status-website:
  # DNS: a CNAME record status → md7marcu.github.io in Cloudflare, DNS only (not proxied).
  cname: status.mcrsc.org
  name: Status
  introTitle: "Service status"
  introMessage: "WhereToWatch and brak. Checked every few minutes from GitHub."
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Secrets the checks may read: none. GH_PAT is passed separately.
secrets: []
